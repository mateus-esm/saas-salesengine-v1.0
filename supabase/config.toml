[api]
enabled = true
port = 64321           # Mudamos de 54321 para 64321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17
port = 6432            # Mudamos de 5432 para 6432
shadow_port = 6433     # Mudamos de 54320 para 6433

[studio]
enabled = true
port = 64323           # Mudamos de 54323 para 64323 (só garantindo)
api_url = "http://127.0.0.1:64321"

[inbucket]
enabled = true
port = 64324           # Mudamos de 54324 para 64324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 64325 # Porta de inspeção também movida

# Sprint 8 T5 — Asaas calls this; there is no Supabase JWT. Authenticated by the
# asaas-access-token header compared against ASAAS_WEBHOOK_TOKEN.
[functions.asaas-webhook]
verify_jwt = false

# Sprint 8 T7 — called by pg_cron via net.http_post; authenticated by
# x-cron-secret against BILLING_CRON_SECRET, never a service-role key.
[functions.billing-cron]
verify_jwt = false

# Sprint 8 T8 — drains notification_deliveries. Called by cron and directly
# after critical events. Authenticated by x-cron-secret.
[functions.notification-dispatcher]
verify_jwt = false

# Sprint 8 T9 — super-admin only, called from the admin panel. Keeps JWT
# verification: it must know who is asking.
[functions.provision-tenant]
verify_jwt = true

# Sprint 8 T11 — nightly reconciliation of the ledger against the provider.
# Corrects the ledger; never becomes the source of truth.
[functions.credits-reconcile]
verify_jwt = false

# Sprint 8 T17 — public: the person reading a proposal is not a user yet.
# Reads by codigo with the service role; the proposals table is never exposed to anon.
[functions.public-proposal]
verify_jwt = false

# Sprint 8.2 — buy instances (recurring contract item) or Builder hours (adhoc).
[functions.purchase-addon]
verify_jwt = true

# Sprint 8.1 fixes — on-demand agent on/off reconciliation. Super-admin JWT or
# the cron secret; "daily" is the wrong latency for resuming a paying customer.
[functions.agent-power-sync]
verify_jwt = false
