[project]
name = "solo-copilot-agent"
version = "0.1.0"
description = "FastAPI service for the Sprint 6 Solo Copilot agent layer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agno",
  "fastapi",
  "openai",
  "psycopg[binary,pool]",
  "pydantic>=2",
  "pydantic-settings",
  "pyjwt",
  "python-dotenv",
  "sqlalchemy",
  "supabase",
  "uvicorn[standard]",
]

[dependency-groups]
dev = [
  "httpx",
  "pytest",
  "pytest-asyncio",
  "respx",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Unit gate: bare `pytest` collects ONLY tests/ (fast, no model, runs on every PR).
# The Evals dyno (evals/) is slow / model-hitting — run it explicitly pre-deploy:
#   python -m pytest evals/
testpaths = ["tests"]
asyncio_mode = "auto"

