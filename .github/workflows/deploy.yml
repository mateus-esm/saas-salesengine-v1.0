name: Deploy Functions Mobile

on:
  push:
    branches: ["main"]
    paths: ["supabase/functions/**", "supabase/config.toml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v3
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      
      # Deploy ignorando JWT check para a função de análise
      - run: supabase functions deploy analyze-message --no-verify-jwt
      
      # Deploy normal para o webhook
      - run: supabase functions deploy gpt-maker-webhook

      
