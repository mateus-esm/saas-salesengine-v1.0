name: Deploy Functions Mobile

on:
  push:
    branches: ["main"]
    paths: ["supabase/functions/**", "supabase/config.toml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v3
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      
      # Deploy ignorando JWT check para a função de análise
      - run: supabase functions deploy analyze-message --no-verify-jwt
      - run: supabase functions deploy gpt-maker-webhook
      - run: supabase functions deploy fetch-gpt-credits
      - run: supabase functions deploy send-chat-message
      - run: supabase functions deploy asaas-buy-credits
      - run: supabase functions deploy asaas-subscribe
      - run: supabase functions deploy crm-webhook --no-verify-jwt
      - run: supabase functions deploy sync-chat-history
      - run: supabase functions deploy process-automations
      - run: supabase functions deploy manage-agent-training
      - run: supabase functions deploy manage-solo-instances
      - run: supabase functions deploy solo-wpp-webhook --no-verify-jwt
      - run: supabase functions deploy sync-instance-billing
      - run: supabase functions deploy solo-health-check --no-verify-jwt
